name: Erro na documentação
description: Relate um erro, contradição, link quebrado ou afirmação sem fonte.
title: "[Documentação] "
labels: ["docs"]
body:
  - type: input
    id: arquivo
    attributes:
      label: Arquivo
      description: Caminho do arquivo no repositório, por exemplo docs/especificacao/principios.md.
    validations:
      required: true
  - type: textarea
    id: trecho
    attributes:
      label: Trecho
      description: Cole o trecho exato ou indique a linha.
    validations:
      required: true
  - type: textarea
    id: erro
    attributes:
      label: O que está errado
    validations:
      required: true
  - type: textarea
    id: fonte
    attributes:
      label: Fonte
      description: Link ou referência que sustenta a correção. Se não houver fonte, diga isso.
    validations:
      required: true
  - type: dropdown
    id: uso-de-ia
    attributes:
      label: Divulgação de uso de IA
      description: Obrigatório para contribuições externas, conforme o AI_POLICY.md. Informe se IA ajudou a escrever esta issue. Mantenedores escolhem a opção de mantenedor.
      options:
        - "Uso de IA: não"
        - Usei IA para apoio de escrita ou pesquisa
        - A maior parte foi gerada com IA e revisada por mim
        - Sou mantenedor (isento da divulgação)
    validations:
      required: true
  - type: input
    id: ferramenta-ia
    attributes:
      label: Ferramenta e extensão do uso de IA
      description: Se usou IA, diga qual ferramenta e em que extensão. Pode ficar em branco se não usou.
    validations:
      required: false
  - type: checkboxes
    id: confirmacao
    attributes:
      label: Confirmação
      options:
        - label: Li o CONTRIBUTING.md e o código de conduta do projeto.
          required: true
