# Contraprova: project page, served as static files.
# Installed as /etc/nginx/snippets/contraprova.conf and included in the
# efer.online server block. Files live in /var/www/contraprova/projeto/contraprova/.

location = /projeto/contraprova {
    return 301 /projeto/contraprova/;
}

# Project page.
location ^~ /projeto/contraprova/ {
    root /var/www/contraprova;
    index index.html;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
